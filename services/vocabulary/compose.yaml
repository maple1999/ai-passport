services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      VOCAB_DATABASE: /data/vocabulary.sqlite3
    ports:
      - "127.0.0.1:${VOCAB_PORT:-18081}:8000"
    volumes:
      - vocabulary_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  vocabulary_data:
